<main class="admin-page">
  <div class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="admin-eyebrow">FoodExpress · Administration</p>
        <h1>Modifier un utilisateur</h1>
      </div>
      <a class="admin-secondary-button" routerLink="/admin/users">Retour aux utilisateurs</a>
    </header>

    @if (flashMessage.message()) {
      <p class="admin-success" role="status">{{ flashMessage.message() }}</p>
    }
    @if (errorMessage()) {
      <p class="admin-error" role="alert">{{ errorMessage() }}</p>
    }

    @if (isLoading()) {
      <section class="admin-card"><p class="admin-message">Chargement…</p></section>
    } @else if (!errorMessage()) {
      <section class="admin-card">
        <form class="admin-form" [formGroup]="form" (ngSubmit)="save()" novalidate>
          <label class="admin-field">
            Prénom
            <input type="text" formControlName="prenom" autocomplete="given-name" />
            @if (form.controls.prenom.touched && form.controls.prenom.invalid) {
              <small>Le prénom est obligatoire et ne peut pas dépasser 100 caractères.</small>
            }
          </label>
          <label class="admin-field">
            Nom
            <input type="text" formControlName="nom" autocomplete="family-name" />
            @if (form.controls.nom.touched && form.controls.nom.invalid) {
              <small>Le nom est obligatoire et ne peut pas dépasser 100 caractères.</small>
            }
          </label>
          <label class="admin-field">
            E-mail
            <input type="email" formControlName="email" autocomplete="email" />
            @if (form.controls.email.touched && form.controls.email.invalid) {
              <small>Veuillez saisir une adresse e-mail valide.</small>
            }
          </label>
          <label class="admin-field">
            Téléphone
            <input type="tel" formControlName="telephone" autocomplete="tel" />
            @if (form.controls.telephone.touched && form.controls.telephone.invalid) {
              <small>Veuillez saisir un numéro valide de 7 à 15 chiffres.</small>
            }
          </label>
          <label class="admin-field">
            Rôle
            <select formControlName="role">
              <option value="client">Client</option>
              <option value="restaurateur">Restaurateur</option>
              <option value="admin" [disabled]="isSelf()">Admin</option>
            </select>
            @if (isSelf()) {
              <small>Vous ne pouvez pas retirer votre propre rôle administrateur.</small>
            }
          </label>
          <div class="admin-buttons">
            <button type="submit" class="admin-link-button" [disabled]="isSaving()">
              {{ isSaving() ? 'Enregistrement…' : 'Enregistrer' }}
            </button>
            <a class="admin-secondary-button" routerLink="/admin/users">Annuler</a>
          </div>
        </form>
      </section>
    }
  </div>
</main>
